openapi: 3.1.0
info:
  title: Camera KakaoMap GPT Action API
  version: 1.0.0
  description: >
    Lookup unmanned traffic enforcement cameras by the official management number.
    If the input is exactly four digits, return every camera that shares the same last four digits.
servers:
  - url: https://camera-kakaomap-gpt-direct.vercel.app
paths:
  /camera-link:
    get:
      operationId: getCameraLink
      summary: Get camera link information
      description: >
        Use the full official camera management number for an exact match, or use four digits
        to retrieve all cameras whose management number ends with those digits.
      parameters:
        - in: query
          name: cameraCode
          required: true
          schema:
            type: string
          description: Full management number or a four-digit suffix.
      responses:
        "200":
          description: Lookup result
          content:
            application/json:
              schema:
                type: object
                required:
                  - query
                  - normalizedQuery
                  - queryType
                  - matched
                  - count
                  - source
                  - results
                properties:
                  query:
                    type: string
                  normalizedQuery:
                    type: string
                  queryType:
                    type: string
                    enum: [exact, suffix]
                  matched:
                    type: boolean
                  count:
                    type: integer
                  source:
                    type: string
                  message:
                    type: string
                  results:
                    type: array
                    items:
                      type: object
                      required:
                        - cameraCode
                        - cameraName
                        - latitude
                        - longitude
                        - kakaoMapUrl
                      properties:
                        cameraCode:
                          type: string
                        cameraName:
                          type: string
                        roadAddress:
                          type: string
                        lotNumberAddress:
                          type: string
                        latitude:
                          type: number
                        longitude:
                          type: number
                        installationLocation:
                          type: string
                        enforcementType:
                          type: string
                        speedLimit:
                          type: number
                        provinceName:
                          type: string
                        cityName:
                          type: string
                        sourceUpdatedAt:
                          type: string
                        suffixDigits:
                          type: string
                        kakaoMapUrl:
                          type: string
                          format: uri
              examples:
                exactMatch:
                  summary: Exact management number
                  value:
                    query: G1234
                    normalizedQuery: G1234
                    queryType: exact
                    matched: true
                    count: 1
                    source: NationalTrafficEnforcementCameraStandardData
                    results:
                      - cameraCode: G1234
                        cameraName: 남진빌라 앞 삼거리 (남원대교→광한루)
                        lotNumberAddress: 전북특별자치도 남원시 죽항동 58-1
                        latitude: 35.4074661
                        longitude: 127.3878055
                        kakaoMapUrl: https://map.kakao.com/link/map/G1234,35.4074661,127.3878055
                suffixMatch:
                  summary: Four-digit suffix
                  value:
                    query: "1234"
                    normalizedQuery: "1234"
                    queryType: suffix
                    matched: true
                    count: 4
                    source: NationalTrafficEnforcementCameraStandardData
                    results:
                      - cameraCode: "1234"
                        cameraName: 현산물류센터 앞
                        latitude: 37.492402
                        longitude: 126.492312
                        kakaoMapUrl: https://map.kakao.com/link/map/1234,37.492402,126.492312
        "400":
          description: Invalid request
